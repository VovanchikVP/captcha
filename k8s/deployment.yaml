apiVersion: apps/v1
kind: Deployment
metadata:
  name: show-img
  namespace: rtt
  labels:
    app: show-img
spec:
  replicas: 1
  selector:
    matchLabels:
      app: show-img
  template:
    metadata:
      labels:
        app: show-img
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: show-img
          image: show-img:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PAGE_SIZE
              value: "30"
          envFrom:
            - secretRef:
                name: show-img-db
          # поды не стартуют, пока база недоступна — это осознанно:
          # без DATABASE_URL приложение падает на старте с понятной ошибкой
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
