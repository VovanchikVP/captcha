apiVersion: apps/v1
kind: Deployment
metadata:
  name: show-img
  namespace: rtt
  labels:
    app: show-img
spec:
  replicas: 1
  selector:
    matchLabels:
      app: show-img
  template:
    metadata:
      labels:
        app: show-img
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: show-img
          image: show-img:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              # менять порт здесь и в UVICORN_PORT ниже одновременно:
              # containerPort — это только метаданные, процесс слушает то,
              # что сказано в UVICORN_PORT
              containerPort: 8000
          env:
            - name: UVICORN_PORT
              value: "8000"
            - name: PAGE_SIZE
              value: "30"
            # как часто фоновая задача сверяет список неотвеченных картинок
            - name: WATCH_INTERVAL_SEC
              value: "10"
          envFrom:
            - secretRef:
                name: show-img-db
            # VAPID-ключи для Web Push; без этого секрета сервис работает,
            # но уведомления выключены и кнопка на странице скрыта
            - secretRef:
                name: show-img-push
          # процесс начинает слушать порт сразу, не дожидаясь базы;
          # недоступность Postgres видна как 503 на /readyz, а не как refused
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
