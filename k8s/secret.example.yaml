# Скопировать в secret.yaml, подставить реальную строку подключения и применить.
# secret.yaml в git не коммитить (добавлен в .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: show-img-db
  namespace: rtt
type: Opaque
stringData:
  DATABASE_URL: postgresql://user:password@postgres.default.svc.cluster.local:5432/dbname
---
# Ключи Web Push. Сгенерировать: uv run python gen_vapid_keys.py
# Менять после того, как кто-то подписался, нельзя — подписки станут мёртвыми.
apiVersion: v1
kind: Secret
metadata:
  name: show-img-push
  namespace: rtt
type: Opaque
stringData:
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  # контакт для push-сервиса, обязан быть mailto: или https:
  VAPID_SUBJECT: mailto:admin@example.com
