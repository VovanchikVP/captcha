# Скопировать в secret.yaml, подставить реальную строку подключения и применить.
# secret.yaml в git не коммитить (добавлен в .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: show-img-db
  namespace: rtt
type: Opaque
stringData:
  DATABASE_URL: postgresql://user:password@postgres.default.svc.cluster.local:5432/dbname
