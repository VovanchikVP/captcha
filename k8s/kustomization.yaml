apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rtt

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # secret.yaml создаётся из secret.example.yaml и не коммитится
  - secret.yaml

images:
  - name: show-img
    newTag: latest

# Секрет show-img-tls с сертификатом домена создаётся отдельно
# (kubectl create secret tls), чтобы ключ не лежал в репозитории — см. README.
