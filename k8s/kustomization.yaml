apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rtt

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

images:
  # тег подставляет пайплайн: kustomize edit set image show-img=<образ>:<tag>
  - name: show-img
    newTag: latest

# Секреты в оверлей намеренно не включены, чтобы в репозитории не лежали ключи:
#   show-img-db, show-img-push — создаёт workflow CD из секретов GitHub
#                                (вручную: kubectl apply -f k8s/secret.yaml)
#   show-img-tls              — сертификат домена, kubectl create secret tls
# Подробности — в README.
